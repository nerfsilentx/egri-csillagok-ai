<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Egri Csillagok AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f0e0d;
  --bg2: #1a1917;
  --bg3: #242220;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0ede8;
  --text2: #a09890;
  --text3: #6a635c;
  --accent: #c8a96e;
  --accent2: #a07840;
  --user-bg: #2a2420;
  --ai-bg: #1e1c1a;
  --radius: 16px;
  --font-body: 'DM Sans', sans-serif;
  --font-serif: 'Crimson Pro', serif;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 0;
}

.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.logo-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.logo-text {
  font-family: var(--font-serif);
  font-size: 17px;
  color: var(--text);
  font-weight: 600;
  letter-spacing: 0.01em;
}

.new-chat-btn {
  width: 100%;
  background: rgba(200,169,110,0.12);
  border: 1px solid rgba(200,169,110,0.25);
  color: var(--accent);
  border-radius: 10px;
  padding: 10px 14px;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.15s;
}
.new-chat-btn:hover { background: rgba(200,169,110,0.2); }

.sidebar-section {
  padding: 16px 16px 8px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.chat-history { flex: 1; overflow-y: auto; padding: 0 8px; }
.chat-history::-webkit-scrollbar { width: 4px; }
.chat-history::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.history-item {
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.12s, color 0.12s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.history-item:hover { background: var(--bg3); color: var(--text); }
.history-item.active { background: var(--bg3); color: var(--text); }

/* MAIN */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  padding: 16px 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.topbar-title {
  font-family: var(--font-serif);
  font-size: 15px;
  color: var(--text2);
  font-style: italic;
}

.model-badge {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  color: var(--text3);
}

/* MESSAGES */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 32px 0;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.messages-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 28px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* Welcome screen */
.welcome {
  text-align: center;
  padding: 60px 20px;
}
.welcome-title {
  font-family: var(--font-serif);
  font-size: 36px;
  color: var(--accent);
  margin-bottom: 10px;
  font-weight: 400;
}
.welcome-sub {
  font-size: 15px;
  color: var(--text2);
  margin-bottom: 36px;
  line-height: 1.7;
}
.welcome-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}
.welcome-chip {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
  font-family: var(--font-body);
  max-width: 240px;
}
.welcome-chip:hover {
  border-color: var(--accent2);
  color: var(--text);
  background: var(--bg3);
}

/* Message rows */
.msg-row { display: flex; gap: 14px; align-items: flex-start; }
.msg-row.user { flex-direction: row-reverse; }

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-serif);
}
.avatar.ai {
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  color: #1a1200;
}
.avatar.user {
  background: var(--bg3);
  border: 1px solid var(--border2);
  color: var(--text2);
  font-size: 12px;
}

.bubble {
  max-width: calc(100% - 60px);
  padding: 14px 18px;
  border-radius: var(--radius);
  font-size: 15px;
  line-height: 1.75;
}
.bubble.ai {
  background: var(--ai-bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-top-left-radius: 4px;
}
.bubble.user {
  background: var(--user-bg);
  border: 1px solid var(--border2);
  color: var(--text);
  border-top-right-radius: 4px;
}
.bubble.loading {
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 6px;
}

.dots { display: flex; gap: 5px; }
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text3);
  animation: pulse 1.4s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* INPUT AREA */
.input-area {
  padding: 16px 28px 24px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.input-wrap {
  max-width: 720px;
  margin: 0 auto;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 14px;
  display: flex;
  align-items: flex-end;
  gap: 0;
  padding: 4px 4px 4px 18px;
  transition: border-color 0.15s;
}
.input-wrap:focus-within { border-color: var(--accent2); }

.input-wrap textarea {
  flex: 1;
  background: none;
  border: none;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  outline: none;
  resize: none;
  max-height: 160px;
  padding: 10px 0;
  min-height: 44px;
}
.input-wrap textarea::placeholder { color: var(--text3); }

.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: rgba(200,169,110,0.2);
  border: 1px solid rgba(200,169,110,0.3);
  color: var(--accent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin: 4px;
  transition: background 0.15s;
  font-size: 16px;
}
.send-btn:hover { background: rgba(200,169,110,0.35); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.input-footer {
  max-width: 720px;
  margin: 8px auto 0;
  font-size: 12px;
  color: var(--text3);
  text-align: center;
}

/* MOBILE */
@media (max-width: 680px) {
  .sidebar { display: none; }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">⚔</div>
      <span class="logo-text">Egri Csillagok AI</span>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <span>＋</span> Új beszélgetés
    </button>
  </div>

</aside>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <span class="topbar-title">Gárdonyi Géza · Egri Csillagok (1901)</span>

          <button class="welcome-chip" onclick="ask('Ki volt Bornemissza Gergő és mi volt az útja a regényben?')">Ki volt Bornemissza Gergő?</button>

      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea
        id="userInput"
        placeholder="Kérdezz az Egri Csillagokról..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
    </div>
    <div class="input-footer">Az AI válaszokat adhat — ellenőrizd a fontos információkat.</div>
  </div>
</main>

<script>
// ──────────────────────────────────────────────────────────────
//  BEÁLLÍTÁSOK ÉS TUDÁSBÁZIS
// ──────────────────────────────────────────────────────────────
const apiKey = '4Eu4UGNOc83oxv3uAv21uoDxL9zfNpXqFclYzgkf'; // <--- IDE MÁSOLD BE AZ API KULCSODAT

const KB = [
  { k: ["gárdonyi","szerző","ki írta","írta","keletkezés","1901","1899"],
    v: "Az Egri Csillagok szerzője Gárdonyi Géza (1863–1922), eredeti nevén Ziegler Géza. A regény 1899-ben jelent meg először folytatásokban az Egri Újságban, könyv alakban 1901-ben adták ki. Gárdonyi Egerben élt, és a vár közelében töltötte élete nagy részét, ami erősen inspirálta a mű megírásában. A regény a magyar irodalom egyik legnagyobb sikerű alkotása." },

  { k: ["ostrom","1552","török","vár","csata","eger","ali pasa","sereg","védők","szeptembertől"],
    v: "Az egri vár ostromára 1552 szeptemberében–októberében került sor. Ali pasa kb. 35–40 000 fős török serege szállt szembe a Dobó István vezette kb. 2000 fős védősereggeL (köztük nőkkel és civilekkel). Az ostrom 38 napig tartott (szeptember 9. – október 18.) és a magyar védők győzelmével végződött. A törökök kénytelenek voltak elvonulni. Ez az esemény az egész keresztény Európát meglepte, és nemzeti legendává vált." },

  { k: ["bornemissza","gergő","gergely","főhős","kisfiú","vitéz","fejlődés"],
    v: "Bornemissza Gergő (teljes nevén Bornemissza Gergely) a regény főhőse. Paraszti sorból indult, szülei korán meghaltak, és Cecey Pál nemesember házába kerül szolgaként. Ott ismerkedik meg Évával, Cecey lányával, akibe beleszeret. Évek alatt vitézzé válik, Magyarváron, majd Sztambulban is megfordul fogságban, és felnőttként Dobó seregébe lép, ahol az egri csatában döntő szerepet játszik. Útja a parasztgyerektől a hős vitézig a regény gerince." },

  { k: ["dobó","dobó istván","kapitány","parancsnok","vezér","vár kapitánya"],
    v: "Dobó István (kb. 1502–1572) Eger várának főkapitánya 1549-től. Erélyes, igazságos, de kemény parancsnok, aki aprólékosan készítette fel a várat az ostromra: élelmiszert halmozott fel, erősítette a falakat, fegyelmet tartott. Az ostrom idején személyesen irányította a védelmet, sebesülten is a falon maradt. A regényben pozitív, hősi alakként jelenik meg, bár néhány jelenetben kemény döntéseket hoz (pl. dezertőrök megbüntetése)." },

  { k: ["éva","cecey éva","szerelem","menyasszony","feleség","cecey lánya"],
    v: "Cecey Éva Gergő gyermekkori szerelme és végül felesége. Cecey Pál nemesember lánya, nemes lelkű, bátor lány. Sorsa tragikusan alakul: Jumurdzsák elrabolja, és évekig fogságban tartja. Gergő hosszú keresés után végül megszabadítja. A regény végén egymáséi lesznek. Éva a hűség, a türelem és a lelkierő szimbóluma a műben." },

  { k: ["jumurdzsák","gonosztevő","rabló","ellenség","antagonista"],
    v: "Jumurdzsák a regény fő antagonistája, kegyetlen tatár-török katona és rabló. Elrabolja Cecey Évát, és éveken át fogságban tartja. Gergő hosszú éveken át üldözi, és az egri csata után végül megöli. Jumurdzsák az erőszak, a gonoszság és a magyarság ellenségeinek megtestesítője a regényben." },

  { k: ["mekcsey","barát","harcostárs","istván","mekcsey istván"],
    v: "Mekcsey István Gergő leghűbb barátja és fegyvertársa. Gyermekkorától fogva együtt nőnek fel, együtt harcolnak, és az egri csatában is egymás mellett küzdenek. A barátság és a lojalitás szimbóluma a regényben." },

  { k: ["cecey","cecey pál","nevelőapa","pártfogó","nemes"],
    v: "Cecey Pál Zemplén vármegyei kisnemesember, aki a kis Gergőt befogadja és gondjaiba veszi. Ő az első pártfogója, aki lehetőséget ad a fiúnak a felemelkedésre. Az ő lányába, Évába szeret bele Gergő. Cecey a vendégszeretet és a nemesi erények képviselője." },

  { k: ["nők","asszonyok","védekezés","harcban","hősnők","asszony"],
    v: "Az ostrom egyik emlékezetes motívuma, hogy az egri asszonyok és nők is részt vettek a védelemben: forró vizet, szurkot, köveket dobtak a falakról a törökökre. Ez a mozzanat irodalmi és történelmi legendává vált, és a regényben is hangsúlyos szerepet kap." },

  { k: ["tema","téma","üzenet","hazaszeretet","hősiség","tanulság","erkölcs"],
    v: "A regény főbb témái: (1) hazaszeretet és önfeláldozás — a kis nemzet hősiessége a sokszoros túlerővel szemben; (2) a hit ereje — a védők vallási meggyőződése segíti a kitartást; (3) egyéni fejlődés — Gergő útja a szegény gyerektől a vitézig; (4) szerelem és hűség — Gergő és Éva kapcsolata; (5) jó és rossz küzdelme — Jumurdzsákkal szemben. Gárdonyi nemzeti öntudat és büszkeség erősítésére szánta a művet." },

  { k: ["mohács","történelmi háttér","1526","ottoman","oszmán birodalom","16. század"],
    v: "A regény a mohácsi csata (1526) utáni korszakban játszódik, amikor az Oszmán Birodalom fokozatosan terjeszkedett a Magyar Királyság rovására. A középső országrész török uralom alá került, és Eger stratégiai fontosságú végvár volt az észak-magyarországi védelmi vonalban. Az 1552-es egri győzelem így nem csupán katonai siker, hanem szimbolikus ellenállás volt a hódítással szemben." },

  { k: ["türelem","fogság","sztambul","konstantinápoly","rabság"],
    v: "Gergő útja során fogságba esik, és egy ideig Sztambulban (Konstantinápolyban) tölt időt. Ez a rész lehetőséget ad Gárdonyi Géza számára, hogy bemutassa az oszmán birodalmat belülről, annak kultúráját, palotáit és szokásait. Gergő megfigyeli az ellenséget, ami később az egri csatában is hasznos tudásnak bizonyul." },

  { k: ["stílus","irodalom","értékelés","hatás","népszerűség"],
    v: "Gárdonyi realista és romantikus elemeket ötvöz a regényben. Stílusa érzékletes, a történelmi korhangulat hitelesen van megteremtve. A mű generációk óta kötelező iskolai olvasmány Magyarországon, és az egyik leggyakrabban kiadott magyar regény. Filmes feldolgozása is készült (1968, rendező: Várkonyi Zoltán)." },

  { k: ["film","1968","feldolgozás","mozgókép","várkonyi"],
    v: "Az Egri Csillagok 1968-ban készült el filmadaptációként Várkonyi Zoltán rendezésében. A filmet az egri várban forgatták, és nagy sikerű produkció lett. Dobó Istvánt Sinkovits Imre, Gergőt pedig Szabó Gyula alakította. A film ma is klasszikusnak számít a magyar filmtörténetben." },
];

function findContext(question) {
  const q = question.toLowerCase();
  const words = q.split(/\s+/);
  let best = null, bestScore = 0;
  for (const item of KB) {
    let score = 0;
    for (const kw of item.k) {
      if (q.includes(kw)) score += kw.split(' ').length > 1 ? 3 : 1;
    }
    if (score > bestScore) { bestScore = score; best = item.v; }
  }
  return bestScore > 0 ? best : '';
}

// ──────────────────────────────────────────────────────────────
//  ÁLLAPOT
// ──────────────────────────────────────────────────────────────
let conversations = JSON.parse(localStorage.getItem('conversations') || '[]');
let currentId = null;
let isLoading = false;

//  INIT
// ──────────────────────────────────────────────────────────────
window.onload = () => {
  renderHistory();
};

// ──────────────────────────────────────────────────────────────
//  ELŐZMÉNY KEZELÉS
// ──────────────────────────────────────────────────────────────
function newChat() {
  currentId = null;
  document.getElementById('messagesInner').innerHTML = '';
  showWelcome();
  document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
}

function showWelcome() {
  const inner = document.getElementById('messagesInner');
  inner.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="welcome-title">Egri Csillagok</div>
      <div class="welcome-sub">Kérdezz a regény cselekményéről, szereplőiről,<br/>történelmi hátteréről vagy irodalmi értékeiről.</div>
      <div class="welcome-chips">
        <button class="welcome-chip" onclick="ask('Ki volt Bornemissza Gergő és mi volt az útja a regényben?')">Ki volt Bornemissza Gergő?</button>
        <button class="welcome-chip" onclick="ask('Mikor és hogyan zajlott le az egri vár ostroma 1552-ben?')">Az egri vár ostroma 1552-ben</button>
        <button class="welcome-chip" onclick="ask('Milyen szerepe volt Dobó Istvánnak a védelemben?')">Dobó István szerepe</button>
        <button class="welcome-chip" onclick="ask('Mi történt Cecey Évával a regényben?')">Cecey Éva sorsa</button>
        <button class="welcome-chip" onclick="ask('Mik a regény főbb témái és üzenete?')">A regény témái és üzenete</button>
        <button class="welcome-chip" onclick="ask('Ki volt Jumurdzsák és mi volt a szerepe?')">Ki volt Jumurdzsák?</button>
      </div>
    </div>`;
}

function renderHistory() {
  const el = document.getElementById('history');
  el.innerHTML = '';
  if (conversations.length === 0) {
    el.innerHTML = '<div style="padding:12px 16px;font-size:13px;color:var(--text3)">Még nincs előzmény</div>';
    return;
  }
  conversations.slice().reverse().forEach(conv => {
    const d = document.createElement('div');
    d.className = 'history-item' + (conv.id === currentId ? ' active' : '');
    d.innerHTML = '💬 ' + (conv.title || 'Névtelen');
    d.onclick = () => loadConv(conv.id);
    el.appendChild(d);
  });
}

function loadConv(id) {
  const conv = conversations.find(c => c.id === id);
  if (!conv) return;
  currentId = id;
  const inner = document.getElementById('messagesInner');
  inner.innerHTML = '';
  conv.messages.forEach(m => appendBubble(m.role, m.content, false));
  document.querySelectorAll('.history-item').forEach(el => {
    el.classList.toggle('active', el.textContent.trim() === '💬 ' + conv.title);
  });
  scrollBottom();
}

// ──────────────────────────────────────────────────────────────
//  ÜZENET KÜLDÉS
// ──────────────────────────────────────────────────────────────
function ask(q) {
  document.getElementById('userInput').value = q;
  sendMessage();
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('userInput');
  const q = input.value.trim();
  if (!q) return;

  if (apiKey === 'IDE_JON_AZ_API_KULCS') {
    alert('Kérlek írd be a saját Gemini API kulcsodat a kódba (apiKey változó)!');
    return;
  }

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  // Eltüntetjük a welcome screent
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  // Új konverzáció ha kell
  if (!currentId) {
    currentId = Date.now().toString();
    conversations.push({ id: currentId, title: q.slice(0, 40), messages: [] });
    renderHistory();
  }

  const conv = conversations.find(c => c.id === currentId);
  conv.messages.push({ role: 'user', content: q });
  appendBubble('user', q, false);

  // Loading indicator
  const loadingEl = appendBubble('ai', '__loading__', true);
  scrollBottom();

  const ctx = findContext(q);
  const systemPrompt = `Te egy irodalmi asszisztens vagy, aki Gárdonyi Géza "Egri Csillagok" c. regényéről válaszol kérdésekre.
Mindig MAGYARUL válaszolj. Légy informatív, de tömör. Kerüld a felesleges ismétlést.
Ha a kérdés nem kapcsolódik a regényhez, jelezd barátságosan, hogy csak az Egri Csillagokról tudsz segíteni.
${ctx ? '\n### Releváns információ a tudásbázisból:\n' + ctx : ''}
### Korábbi üzenetek:
${conv.messages.slice(-6, -1).map(m => m.role === 'user' ? 'Kérdés: ' + m.content : 'Válasz: ' + m.content).join('\n')}`;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: systemPrompt }] },
          contents: [{ role: 'user', parts: [{ text: q }] }],
          generationConfig: {
            temperature: 0.7,
            maxOutputTokens: 600
          }
        })
      }
    );

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || 'API hiba: ' + res.status);
    }

    const data = await res.json();
    const answer = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Nem érkezett válasz.';

    loadingEl.className = 'bubble ai';
    loadingEl.innerHTML = '';
    loadingEl.textContent = answer;

    conv.messages.push({ role: 'assistant', content: answer });
    localStorage.setItem('conversations', JSON.stringify(conversations));

  } catch (e) {
    loadingEl.className = 'bubble ai';
    loadingEl.style.color = '#c87070';
    loadingEl.textContent = '⚠ Hiba: ' + e.message;
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  scrollBottom();
}

// ──────────────────────────────────────────────────────────────
//  DOM HELPERS
// ──────────────────────────────────────────────────────────────
function appendBubble(role, text, loading) {
  const inner = document.getElementById('messagesInner');
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const av = document.createElement('div');
  av.className = 'avatar ' + role;
  av.textContent = role === 'ai' ? '⚔' : 'Te';

  const bubble = document.createElement('div');
  if (loading) {
    bubble.className = 'bubble ai loading';
    bubble.innerHTML = '<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  } else {
    bubble.className = 'bubble ' + role;
    bubble.textContent = text;
  }

  if (role === 'ai') { row.appendChild(av); row.appendChild(bubble); }
  else { row.appendChild(bubble); row.appendChild(av); }

  inner.appendChild(row);
  return bubble;
}

function scrollBottom() {
  const el = document.getElementById('messages');
  setTimeout(() => { el.scrollTop = el.scrollHeight; }, 50);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}
</script>
</body>
